<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StudyHub - 単語カードの作成</title><link rel="stylesheet" href="./css/style.css"><style>body{background:#f3f5f7}.card-shell{max-width:680px;margin:auto;padding:16px 10px 40px}.card-panel{background:#fff;border:2px solid rgba(22,59,99,.8);border-radius:18px;padding:20px}.card-panel h1{color:var(--navy);margin:0 0 6px}.sub{color:var(--muted)}.card-form{display:grid;gap:14px}.card-form label{display:grid;gap:6px;color:var(--navy);font-weight:700}.card-form input{min-height:46px;border:1px solid rgba(22,59,99,.25);border-radius:10px;padding:8px;font:inherit}.card-button{width:100%;min-height:48px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer}.card-status{min-height:1.5em;color:var(--muted)}.card-list{display:grid;gap:8px;margin-top:20px}.card-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #dfe7f6;padding:10px 0}.card-row span{overflow-wrap:anywhere}.delete-button{border:1px solid #b64a4a;border-radius:8px;background:#fff;color:#b64a4a;padding:7px;cursor:pointer}.back-link{display:block;margin-top:18px;text-align:center;color:var(--navy)}</style></head>
<body><main class="card-shell"><section class="card-panel"><h1>単語カードの作成</h1><p id="createSubject" class="sub">読み込み中...</p><form id="cardForm" class="card-form"><label>表<input id="cardFront" maxlength="500" required placeholder="英単語や質問"></label><label>裏<input id="cardBack" maxlength="500" required placeholder="日本語や答え"></label><button class="card-button" type="submit">カードを追加</button></form><p id="createStatus" class="card-status" aria-live="polite"></p><div id="cardList" class="card-list"></div><a id="backToCards" class="back-link" href="./cards.html">単語カードへ戻る</a></section></main><script type="module" src="./firebase.js?v=20260922-cards1"></script><script type="module" src="./auth.js?v=20260922-cards1"></script><script type="module" src="./js/auth/auth-guard.js?v=20260922-cards1"></script><script type="module" src="./js/cards-create.js?v=20260922-cards1"></script></body></html>
