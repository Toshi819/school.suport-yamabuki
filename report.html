<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub - 問題を報告</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <style>
      body { background: #f3f5f7; }
      .report-shell { max-width: 620px; margin: 0 auto; padding: 24px 16px 40px; }
      .report-card { background: #fff; border: 2px solid rgba(22, 59, 99, 0.8); border-radius: 20px; padding: 20px; }
      .report-form { display: grid; gap: 14px; margin-top: 20px; }
      .report-form label { display: grid; gap: 6px; color: var(--navy); font-weight: 700; }
      .report-form input, .report-form textarea, .report-form select { min-height: 44px; border: 1px solid rgba(22, 59, 99, 0.2); border-radius: 10px; padding: 8px 10px; font: inherit; }
      .report-form textarea { min-height: 160px; resize: vertical; }
      .report-actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .report-status { color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="report-shell">
      <section class="report-card">
        <h1>問題を報告</h1>
        <p class="report-status">アプリの不具合や気になる点を管理者へ送信します。</p>
        <form id="reportForm" class="report-form">
          <label>種類<select id="reportCategory"><option>不具合</option><option>授業情報の間違い</option><option>要望</option><option>その他</option></select></label>
          <label>件名<input id="reportTitle" maxlength="100" required /></label>
          <label>内容<textarea id="reportMessage" maxlength="2000" required></textarea></label>
          <div class="report-actions"><button class="primary-btn" type="submit">送信する</button><a class="secondary-btn" href="./home.html">ホームへ戻る</a></div>
        </form>
        <p id="reportStatus" class="report-status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="./firebase.js?v=20260922-cleanup"></script>
    <script type="module" src="./auth.js?v=20260922-cleanup"></script>
    <script type="module" src="./js/auth/auth-guard.js?v=20260922-cleanup"></script>
    <script type="module" src="./js/report.js?v=20260922-cleanup"></script>
  </body>
</html>
