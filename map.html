<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub - 地図</title>
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      body { margin: 0; min-height: 100vh; background: #fff; color: #111; }
      .map-shell { max-width: 430px; min-height: 100vh; margin: 0 auto; border: 1px solid #163b63; display: flex; flex-direction: column; }
      .map-head { display: flex; align-items: center; gap: 24px; padding: 18px 16px 10px; }
      .map-head a { color: #111; font-size: 1.8rem; text-decoration: none; line-height: 1; }
      .map-head h1 { margin: 0; font-size: 1.2rem; font-weight: 400; }
      .map-main { flex: 1; padding: 28px 18px 90px; }
      .map-placeholder { min-height: 430px; border: 2px dashed #0871a7; background: #f8fbff; display: grid; place-items: center; text-align: center; color: #163b63; padding: 20px; }
      .map-placeholder strong { display: block; margin-bottom: 10px; font-size: 1.3rem; font-weight: 400; }
      .map-placeholder p { margin: 0; color: #555; line-height: 1.6; }
      .map-bottom-nav { display: grid; grid-template-columns: repeat(5, 1fr); min-height: 58px; border-top: 1px solid #111; margin-top: auto; }
      .map-bottom-nav a { display: grid; place-items: center; color: #111; border-right: 1px solid #111; font-size: .8rem; text-decoration: none; }
      .map-bottom-nav a:last-child { border-right: 0; }
      .map-bottom-nav .active { position: relative; width: 78px; height: 78px; margin: -25px auto 0; border: 2px solid #8f4612; border-radius: 50%; background: #f2762b; color: #fff; font-size: 1rem; z-index: 1; }
      @media (min-width: 700px) { .map-shell { margin-top: 24px; min-height: 720px; } }
    </style>
  </head>
  <body>
    <main class="map-shell">
      <header class="map-head"><a href="./home.html" aria-label="ホームへ戻る">‹</a><h1>地図</h1></header>
      <section class="map-main">
        <div class="map-placeholder"><div><strong>校内地図</strong><p>地図データを準備中です。<br />準備ができ次第、ここに表示します。</p></div></div>
      </section>
      <nav class="map-bottom-nav" aria-label="メインメニュー">
        <a class="active" href="./map.html">地図</a><a href="#">問題</a><a href="./home.html">授業</a><a href="#">カード</a><a href="./files.html">ファイル</a>
      </nav>
    </main>
  </body>
  <script src="./js/version.js?v=20260922"></script>
</html>
