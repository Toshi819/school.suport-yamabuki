<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub - 管理者</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <style>
      body { background: #f3f5f7; }
      .admin-shell { max-width: 960px; margin: 0 auto; padding: 24px 16px 40px; }
      .admin-card { background: #fff; border: 2px solid rgba(22, 59, 99, 0.8); border-radius: 20px; padding: 20px; }
      .admin-head { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 20px; }
      .admin-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 16px; background: #f8fbff; border-radius: 14px; }
      .admin-form .full { grid-column: 1 / -1; }
      .admin-form label { display: grid; gap: 6px; color: var(--navy); font-weight: 700; }
      .admin-form input, .admin-form select { min-height: 42px; border: 1px solid rgba(22, 59, 99, 0.2); border-radius: 10px; padding: 8px 10px; }
      .subject-list { display: grid; gap: 10px; margin-top: 20px; }
      .subject-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; border-bottom: 1px solid rgba(22, 59, 99, 0.14); padding: 12px 0; }
      .subject-meta { color: var(--muted); font-size: 0.9rem; }
      .delete-btn { border: 1px solid #d95d5d; color: #b64a4a; background: #fff; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
      #adminSecondDayField[hidden] { display: none !important; }
      .account-section { margin-top: 32px; padding-top: 20px; border-top: 2px solid rgba(22, 59, 99, 0.12); }
      .account-row { display: grid; grid-template-columns: 1.2fr 1.3fr 1fr 1fr auto; gap: 12px; align-items: center; border-bottom: 1px solid rgba(22, 59, 99, 0.14); padding: 12px 0; }
      .account-meta { color: var(--muted); font-size: 0.82rem; overflow-wrap: anywhere; }
      .reset-btn { border: 1px solid rgba(47, 111, 230, 0.5); color: var(--navy); background: #fff; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
      .admin-footer { margin-top: 28px; padding-top: 20px; border-top: 2px solid rgba(22, 59, 99, 0.12); text-align: center; }
      .admin-logout-btn { border: 1px solid #d95d5d; color: #b64a4a; background: #fff; border-radius: 10px; padding: 10px 18px; cursor: pointer; font-weight: 700; }
      @media (max-width: 760px) { .account-row { grid-template-columns: 1fr 1fr; } }
      @media (max-width: 620px) { .admin-form { grid-template-columns: 1fr; } .admin-form .full { grid-column: auto; } .admin-head, .subject-row { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <main class="admin-shell">
      <section class="admin-card">
        <div class="admin-head">
          <div>
            <h1>授業マスタ管理</h1>
            <p class="subtitle">一般ユーザーが時間割に選べる授業を管理します</p>
          </div>
          <a href="./home.html" class="secondary-btn">ホームへ戻る</a>
        </div>
        <form id="adminSubjectForm" class="admin-form">
          <label>授業名<input id="adminSubjectName" required maxlength="80" /></label>
          <label>先生<input id="adminTeacher" required maxlength="80" /></label>
          <label>教室<input id="adminRoom" required maxlength="40" /></label>
          <label>階数<input id="adminFloor" type="number" min="1" max="20" value="1" required /></label>
          <label>曜日<select id="adminDay"><option>月</option><option>火</option><option>水</option><option>木</option><option>金</option></select></label>
          <label id="adminSecondDayField" hidden>2つ目の曜日<select id="adminSecondDay"><option>月</option><option>火</option><option>水</option><option>木</option><option>金</option></select></label>
          <label>時限<select id="adminPeriod"></select></label>
          <label>授業の種類<select id="adminCategory"><option>数学</option><option>国語</option><option>科学</option><option>社会</option><option>英語</option><option>情報</option><option>その他</option></select></label>
          <label><span><input id="adminDoublePeriod" type="checkbox" /> 2コマ授業</span></label>
          <label><span><input id="adminFourPeriod" type="checkbox" /> 4コマ授業</span></label>
          <div class="full"><button class="primary-btn" type="submit">授業マスタに追加</button></div>
        </form>
        <p id="adminStatus" class="note" aria-live="polite"></p>
        <div id="adminSubjectList" class="subject-list"></div>
        <section class="account-section">
          <h2>アカウント管理</h2>
          <p class="note">パスワードは表示せず、必要な場合は本人のメールアドレスへ再設定メールを送信します。</p>
          <div id="adminAccountList" class="subject-list"></div>
        </section>
        <div class="admin-footer">
          <button id="adminLogoutBtn" class="admin-logout-btn" type="button">ログアウト</button>
        </div>
      </section>
    </main>
    <script type="module" src="./firebase.js?v=20260921-four-period3"></script>
    <script type="module" src="./auth.js?v=20260921-four-period3"></script>
    <script type="module" src="./js/auth/auth-guard.js?v=20260921-four-period3"></script>
    <script type="module" src="./js/admin.js?v=20260921-four-period3"></script>
  </body>
</html>
