<!DOCTYPE html>
<html lang="ja">
 
<head>
    <meta charset="UTF-8">
 
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
 
    <title>StudyHub - ログイン</title>
 
    <link rel="stylesheet" href="css/style.css">
 
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
 
<body>
 
<div class="login-container">
 
    <div class="login-card">
 
        <div class="logo">
            <i class="fa-solid fa-book-open"></i>
        </div>
 
        <h1>StudyHub</h1>
 
        <p class="subtitle">
 
            学習をもっと便利に
 
        </p>
 
        <form id="loginForm">
 
            <div class="input-group">
 
                <label>
                    ユーザーID
                </label>
 
                <input
                    type="text"
                    id="userId"
                    placeholder="SH-000001">
 
            </div>
 
            <div class="input-group">
 
                <label>
                    パスワード
                </label>
 
                <input
                    type="password"
                    id="password"
                    placeholder="パスワード">
 
            </div>
 
            <button
                type="submit"
                class="main-btn">
 
                <i class="fa-solid fa-right-to-bracket"></i>
 
                ログイン
 
            </button>
 
        </form>
 
        <div id="message"
             class="message"></div>
 
        <div class="divider">
 
            <span>または</span>
 
        </div>
 
        <button
            class="google-btn"
            id="googleLogin">
 
            <i class="fa-brands fa-google"></i>
 
            Googleでログイン
 
        </button>
 
        <div class="bottom-links">
 
            <a href="register.html">
 
                新規登録はこちら
 
            </a>
 
        </div>
 
    </div>
 
</div>
 
<script type="module"
src="js/login.js"></script>
 
</body>
 
</html>
