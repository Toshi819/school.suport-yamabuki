<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub - ログイン</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body class="auth-shell">
    <div class="auth-card">
      <h1>StudyHub</h1>
      <p class="subtitle">学習と学校生活をひとつに</p>

      <div class="form-block">
        <div class="field">
          <label for="username">ユーザー名</label>
          <input id="username" type="text" placeholder="ユーザー名" />
        </div>

        <div class="field">
          <label for="password">パスワード</label>
          <input id="password" type="password" placeholder="パスワード" />
        </div>

        <button id="loginBtn" class="primary-btn" type="button">ログイン</button>
        <button id="googleLoginBtn" class="secondary-btn" type="button">Googleでログイン</button>
      </div>

      <div class="link-row">
        <a href="./register.html">新規登録はこちら</a>
      </div>
    </div>

    <script type="module" src="./firebase.js?v=20260922-cleanup"></script>
    <script type="module" src="./auth.js?v=20260922-cleanup"></script>
    <script type="module" src="./js/auth/auth-guard.js?v=20260922-cleanup"></script>
    <script type="module" src="./js/auth/login.js?v=20260922-cleanup"></script>
  </body>
</html>
