<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyHub - 授業メモ</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body{background:#f3f5f7}.memo-shell{max-width:680px;margin:auto;padding:16px 10px 40px}.memo-card{background:#fff;border:2px solid rgba(22,59,99,.8);border-radius:18px;padding:20px}.memo-card h1{color:var(--navy);margin:0 0 6px}.memo-subtitle{color:var(--muted);margin:0 0 18px}.memo-card textarea{width:100%;min-height:300px;box-sizing:border-box;border:1px solid rgba(22,59,99,.25);border-radius:10px;padding:12px;resize:vertical;font:inherit;line-height:1.7}.memo-actions{display:flex;gap:10px;margin-top:14px}.memo-actions button,.memo-actions a{flex:1;text-align:center}.memo-status{min-height:1.5em;color:var(--muted)}@media(max-width:620px){.memo-shell{padding:10px 8px}.memo-card{padding:14px}.memo-card textarea{min-height:260px}.memo-actions{flex-direction:column}}
  </style>
</head>
<body>
  <main class="memo-shell"><section class="memo-card">
    <h1>授業メモ</h1>
    <p id="memoSubject" class="memo-subtitle">読み込み中...</p>
    <textarea id="memoText" maxlength="10000" placeholder="授業の内容や次回までの課題を入力してください"></textarea>
    <p id="memoStatus" class="memo-status" aria-live="polite"></p>
    <div class="memo-actions">
      <button id="saveMemo" class="primary-btn" type="button">保存する</button>
      <button id="deleteMemo" class="secondary-btn" type="button">メモを削除</button>
    </div>
    <a id="backToClass" class="secondary-link" href="./home.html">授業メニューへ戻る</a>
  </section></main>
  <script type="module" src="./firebase.js?v=20260922-memo1"></script>
  <script type="module" src="./auth.js?v=20260922-memo1"></script>
  <script type="module" src="./js/auth/auth-guard.js?v=20260922-memo1"></script>
  <script type="module" src="./js/memo.js?v=20260922-memo1"></script>
</body>
</html>
