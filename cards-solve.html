<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StudyHub - 単語カードを解く</title><link rel="stylesheet" href="./css/style.css"><style>body{background:#f3f5f7}.solve-shell{max-width:680px;margin:auto;padding:16px 10px 40px}.solve-panel{background:#fff;border:2px solid rgba(22,59,99,.8);border-radius:18px;padding:20px;text-align:center}.solve-panel h1{color:var(--navy);margin:0 0 6px}.solve-sub{color:var(--muted)}.flashcard{min-height:230px;display:grid;place-items:center;margin:24px 0;padding:20px;border:2px solid #2f6fe6;border-radius:16px;background:#f8fbff;color:var(--navy);font-size:1.7rem;line-height:1.5;overflow-wrap:anywhere}.flashcard.back{background:#eef8ee;border-color:#3b8b4a}.solve-actions{display:grid;gap:10px}.solve-actions button{min-height:50px;border:1px solid rgba(47,111,230,.35);border-radius:10px;background:#fff;color:var(--navy);font:inherit;font-weight:700;cursor:pointer}.solve-actions .primary{background:var(--navy);color:#fff}.solve-status{min-height:1.5em;color:var(--muted)}.back-link{display:block;margin-top:18px;color:var(--navy)}</style></head>
<body><main class="solve-shell"><section class="solve-panel"><h1>単語カードを解く</h1><p id="solveSubject" class="solve-sub">読み込み中...</p><p id="cardProgress" class="solve-sub"></p><div id="flashcard" class="flashcard">読み込み中...</div><p id="solveStatus" class="solve-status"></p><div class="solve-actions"><button id="flipCard" type="button">裏を見る</button><button id="nextCard" class="primary" type="button">次のカード</button></div><a id="backToCards" class="back-link" href="./cards.html">単語カードへ戻る</a></section></main><script type="module" src="./firebase.js?v=20260922-cards1"></script><script type="module" src="./auth.js?v=20260922-cards1"></script><script type="module" src="./js/auth/auth-guard.js?v=20260922-cards1"></script><script type="module" src="./js/cards-solve.js?v=20260922-cards1"></script></body></html>
