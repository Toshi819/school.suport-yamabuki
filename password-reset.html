<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub - パスワード再設定</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body class="auth-shell">
    <div class="auth-card">
      <h1>パスワード再設定</h1>
      <p class="subtitle">Firebaseに登録されているメールアドレスへ再設定メールを送ります。Googleで登録したアカウントはGoogleでログインしてください。</p>

      <form id="passwordResetForm" class="form-block">
        <div class="field">
          <label for="resetEmail">学校メールアドレス</label>
          <input id="resetEmail" type="email" placeholder="学校メールアドレス" autocomplete="email" required />
        </div>
        <button class="primary-btn" type="submit">再設定メールを送信</button>
      </form>

      <p id="resetStatus" class="subtitle" aria-live="polite"></p>
      <div class="link-row">
        <a href="./index.html">ログインへ戻る</a>
      </div>
    </div>

    <script type="module" src="./firebase.js?v=20260923-auth-email"></script>
    <script type="module" src="./auth.js?v=20260923-auth-email"></script>
    <script type="module" src="./js/auth/password-reset.js?v=20260923-password-reset-page3"></script>
  </body>
</html>
