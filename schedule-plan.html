<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub - 時間割登録</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
      body {
        background: #f3f5f7;
      }

      .shell {
        max-width: 1100px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 24px 16px 32px;
      }

      .card {
        background: #fff;
        border-radius: 20px;
        border: 2px solid rgba(22, 59, 99, 0.8);
        box-shadow: 0 18px 44px rgba(22, 59, 99, 0.12);
        padding: 20px;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .grid-wrap {
        overflow-x: auto;
      }

      .schedule-grid {
        display: grid;
        grid-template-columns: 60px repeat(5, minmax(120px, 1fr));
        gap: 8px;
      }

      .cell {
        min-height: 62px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        border-radius: 12px;
        border: 1px solid rgba(22, 59, 99, 0.15);
        background: #f9fbff;
        color: var(--navy);
      }

      .head {
        background: rgba(47, 111, 230, 0.08);
        font-weight: 800;
      }

      .period-label {
        background: rgba(242, 140, 40, 0.08);
        font-size: 0.8rem;
        font-weight: 700;
      }

      select {
        width: 100%;
        min-height: 42px;
        border-radius: 10px;
        border: 1px solid rgba(22, 59, 99, 0.15);
        background: white;
        color: var(--navy);
        padding: 8px 10px;
      }

      .action-row {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 18px;
      }

      .note {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="top-row">
          <div>
            <h1>時間割登録</h1>
            <p class="subtitle">授業を全体で選んで、最後に「これで登録する」で固定にします</p>
          </div>
          <a href="./home.html" class="secondary-btn" style="display: inline-flex; align-items: center; justify-content: center;">ホームへ戻る</a>
        </div>

        <form id="scheduleForm">
          <div class="grid-wrap">
            <div id="scheduleGrid" class="schedule-grid"></div>
          </div>

          <div class="action-row">
            <button type="submit" class="primary-btn">これで登録する</button>
          </div>
        </form>

        <div class="note">授業は授業登録ページで設定した一覧から選びます。</div>
      </div>
    </div>

    <script src="./firebase.js?v=20260920"></script>
    <script src="./auth.js?v=20260920"></script>
    <script src="./js/auth/auth-guard.js?v=20260920"></script>
    <script src="./js/schedule-plan.js?v=20260920"></script>
  </body>
</html>
