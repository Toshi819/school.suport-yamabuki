<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub - 時間割登録</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <style>
      body {
        background: #f3f5f7;
      }

      .shell {
        max-width: 1100px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 24px 16px 32px;
      }

      .card {
        background: #fff;
        border-radius: 20px;
        border: 2px solid rgba(22, 59, 99, 0.8);
        box-shadow: 0 18px 44px rgba(22, 59, 99, 0.12);
        padding: 20px;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .add-subject-panel {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin: 18px 0 22px;
        padding: 16px;
        border: 1px solid rgba(22, 59, 99, 0.12);
        border-radius: 16px;
        background: #f8fbff;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--navy);
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 42px;
        border-radius: 10px;
        border: 1px solid rgba(22, 59, 99, 0.15);
        background: white;
        color: var(--navy);
        padding: 8px 10px;
      }

      .grid-wrap {
        overflow-x: auto;
      }

      .mobile-grid-wrap,
      .mobile-picker-backdrop {
        display: none;
      }

      .schedule-grid {
        display: grid;
        grid-template-columns: 60px repeat(5, minmax(120px, 1fr));
        gap: 8px;
      }

      .cell {
        min-height: 62px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        border-radius: 12px;
        border: 1px solid rgba(22, 59, 99, 0.15);
        background: #f9fbff;
        color: var(--navy);
      }

      .head {
        background: rgba(47, 111, 230, 0.08);
        font-weight: 800;
      }

      .period-label {
        background: rgba(242, 140, 40, 0.08);
        font-size: 0.8rem;
        font-weight: 700;
      }

      select {
        width: 100%;
        min-height: 42px;
        border-radius: 10px;
        border: 1px solid rgba(22, 59, 99, 0.15);
        background: white;
        color: var(--navy);
        padding: 8px 10px;
      }

      .action-row {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 18px;
      }

      .note {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      @media (max-width: 620px) {
        .shell {
          padding: 12px 8px 24px;
        }

        .card {
          border-radius: 16px;
          padding: 12px 8px;
        }

        .top-row {
          align-items: flex-start;
          flex-direction: column;
          margin-bottom: 10px;
        }

        .top-row h1 {
          font-size: 1.2rem;
        }

        .top-row .secondary-btn {
          width: 100%;
        }

        .add-subject-panel {
          grid-template-columns: 1fr;
        }

        .grid-wrap {
          display: none;
        }

        .mobile-grid-wrap {
          display: block;
          overflow-x: auto;
          margin-top: 12px;
        }

        .mobile-grid {
          display: grid;
          grid-template-columns: 36px repeat(5, minmax(54px, 1fr));
          min-width: 330px;
        }

        .mobile-cell {
          min-height: 54px;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 1px dashed #0871a7;
          background: #fff;
          color: var(--navy);
          font-size: 0.68rem;
          font-weight: 700;
          text-align: center;
          padding: 3px;
        }

        .mobile-cell.header,
        .mobile-cell.period {
          border: 0;
          background: #fff;
          font-size: 0.68rem;
        }

        .mobile-cell.filled {
          background: #13a5d1;
          color: #fff;
          border-style: solid;
          flex-direction: column;
          gap: 2px;
        }

        .mobile-cell .subject {
          font-size: 0.65rem;
          line-height: 1.15;
        }

        .mobile-cell .room {
          font-size: 0.55rem;
          color: var(--muted);
        }

        .mobile-cell .add-slot {
          width: 100%;
          height: 100%;
          min-height: 48px;
          border: 0;
          background: transparent;
          color: #0871a7;
          font-size: 1.35rem;
          cursor: pointer;
        }

        .mobile-picker-backdrop {
          position: fixed;
          z-index: 30;
          inset: 0;
          display: none;
          align-items: flex-end;
          background: rgba(22, 59, 99, 0.32);
        }

        .mobile-picker-backdrop.open {
          display: flex;
        }

        .mobile-picker {
          width: 100%;
          max-height: 72vh;
          overflow-y: auto;
          padding: 16px;
          border-radius: 18px 18px 0 0;
          background: #fff;
        }

        .mobile-picker h2 {
          margin: 0 0 12px;
          color: var(--navy);
          font-size: 1rem;
        }

        .mobile-picker button {
          width: 100%;
          min-height: 44px;
          margin-top: 8px;
          border: 1px solid rgba(22, 59, 99, 0.16);
          border-radius: 10px;
          background: #f8fbff;
          color: var(--navy);
          text-align: left;
          padding: 8px 12px;
          font-weight: 700;
        }

        .mobile-picker .clear-choice {
          background: #fff;
          color: #b64a4a;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="top-row">
          <div>
            <h1>授業登録・時間割選択</h1>
            <p class="subtitle">まず授業を追加してから、曜日と時限ごとに選んで登録します</p>
          </div>
          <a href="./home.html" class="secondary-btn" style="display: inline-flex; align-items: center; justify-content: center;">ホームへ戻る</a>
        </div>

        <div id="status" class="note">曜日と時限に合う授業を選んで登録します。</div>

        <form id="scheduleForm">
          <div class="grid-wrap">
            <div id="scheduleGrid" class="schedule-grid"></div>
          </div>
          <div class="mobile-grid-wrap">
            <div id="mobileScheduleGrid" class="mobile-grid"></div>
          </div>

          <div class="action-row">
            <button type="submit" class="primary-btn">これで登録する</button>
          </div>
        </form>
      </div>
    </div>
    <div id="mobilePickerBackdrop" class="mobile-picker-backdrop" hidden>
      <div class="mobile-picker" role="dialog" aria-modal="true" aria-labelledby="mobilePickerTitle">
        <h2 id="mobilePickerTitle">授業を選択</h2>
        <div id="mobilePickerOptions"></div>
        <button class="clear-choice" id="mobilePickerClear" type="button">未設定に戻す</button>
        <button id="mobilePickerClose" type="button">閉じる</button>
      </div>
    </div>

    <script type="module" src="./firebase.js?v=20260921-mobile1"></script>
    <script type="module" src="./auth.js?v=20260921-mobile1"></script>
    <script type="module" src="./js/auth/auth-guard.js?v=20260921-mobile1"></script>
    <script type="module" src="./js/schedule-plan.js?v=20260921-mobile1"></script>
  </body>
</html>
