<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub - 新規登録</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body class="auth-shell">
    <div class="auth-card">
      <h1>新規登録</h1>
      <p class="subtitle">StudyHubへようこそ</p>

      <div class="form-block">
        <div class="field">
          <label for="username">ユーザー名</label>
          <input id="username" type="text" placeholder="ユーザー名" />
        </div>

        <div class="field">
          <label for="password">パスワード</label>
          <input id="password" type="password" placeholder="パスワード" />
        </div>

        <div class="field">
          <label for="passwordConfirm">パスワード確認</label>
          <input id="passwordConfirm" type="password" placeholder="パスワード確認" />
        </div>

        <button id="registerBtn" class="primary-btn" type="button">登録</button>
        <button id="googleRegisterBtn" class="secondary-btn" type="button">Googleで登録</button>
      </div>

      <div class="link-row">
        <a href="./index.html">ログインへ戻る</a>
      </div>
    </div>

    <script type="module" src="./firebase.js?v=20260921"></script>
    <script type="module" src="./auth.js?v=20260921"></script>
    <script type="module" src="./js/auth/auth-guard.js?v=20260921"></script>
    <script type="module" src="./js/auth/register.js?v=20260921"></script>
  </body>
</html>
