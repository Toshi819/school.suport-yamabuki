<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub - ホーム</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/home.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">StudyHub</div>
        <button id="logoutBtn" class="logout-btn" type="button">ログアウト</button>
      </header>

      <div style="margin: 12px 0 18px; display: flex; justify-content: flex-end;">
        <a href="./subject-register.html" class="secondary-btn" style="display: inline-block; text-align: center;">授業登録</a>
      </div>

      <main>
        <section class="schedule-card">
          <h2>時間割</h2>
          <div id="timetableGrid" class="timetable-grid" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="./firebase.js"></script>
    <script src="./auth.js"></script>
    <script src="./js/auth/auth-guard.js"></script>
    <script src="./js/home.js"></script>
  </body>
</html>
