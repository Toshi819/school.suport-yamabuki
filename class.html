<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub - 授業詳細</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <style>
      .class-card {
        width: min(100%, 440px);
        margin: 32px auto;
        background: #fff;
        border-radius: 24px;
        padding: 24px 20px 18px;
        box-shadow: 0 18px 44px rgba(22, 59, 99, 0.14);
      }
      .class-card h1 {
        margin: 0 0 20px;
        color: var(--navy);
        font-size: 1.8rem;
      }
      .actions {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }
      .danger-btn {
        background: #fff;
        border: 2px solid rgba(217, 93, 93, 0.2);
        color: #b64a4a;
        border-radius: 14px;
        padding: 12px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="class-card">
        <h1 id="classTitle">授業登録</h1>

        <form id="classForm" class="form-block">
          <div class="field">
            <label for="className">授業名</label>
            <input id="className" name="className" type="text" placeholder="例: 物理基礎" required />
          </div>

          <div class="field">
            <label for="teacher">担当者</label>
            <input id="teacher" name="teacher" type="text" placeholder="例: 山田先生" />
          </div>

          <div class="field">
            <label for="room">教室</label>
            <input id="room" name="room" type="text" placeholder="例: 物理室" />
          </div>

          <div class="field">
            <label for="floor">階数</label>
            <input id="floor" name="floor" type="number" min="1" max="20" placeholder="5" />
          </div>

          <div class="actions">
            <button type="submit" class="primary-btn">保存</button>
            <button id="backBtn" type="button" class="secondary-btn">時間割に戻る</button>
            <button id="deleteBtn" type="button" class="danger-btn" hidden>削除</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="./js/auth/auth-guard.js"></script>
    <script type="module" src="./js/class.js"></script>
  </body>
</html>
