<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub - 授業詳細</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <style>
      body {
        background: #f3f5f7;
      }
      .class-shell {
        max-width: 420px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 24px 16px 32px;
      }
      .class-card {
        background: #fff;
        border-radius: 20px;
        border: 2px solid rgba(22, 59, 99, 0.8);
        box-shadow: 0 18px 44px rgba(22, 59, 99, 0.12);
        padding: 0;
        overflow: hidden;
      }
      .class-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 16px 10px;
      }
      .menu-icon {
        width: 18px;
        height: 18px;
        position: relative;
      }
      .menu-icon::before,
      .menu-icon::after,
      .menu-icon span {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--navy);
        border-radius: 3px;
      }
      .menu-icon::before { top: 0; }
      .menu-icon span { top: 7px; }
      .menu-icon::after { bottom: 0; }
      .class-head h1 {
        margin: 0;
        font-size: 1.1rem;
        color: var(--navy);
      }
      .class-body {
        padding: 0 16px 16px;
      }
      .detail-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid rgba(22, 59, 99, 0.15);
        color: var(--navy);
        font-weight: 700;
      }
      .detail-line strong {
        font-size: 0.9rem;
      }
      .detail-line span {
        color: var(--muted);
      }
      .tab-list {
        display: grid;
        gap: 10px;
        margin: 18px 0 16px;
      }
      .tab {
        width: 100%;
        text-align: left;
        padding: 12px 12px;
        border: none;
        border-bottom: 2px solid var(--blue);
        background: transparent;
        color: var(--navy);
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      .map-box {
        background: #e8ebee;
        border: 2px solid rgba(22, 59, 99, 0.7);
        min-height: 230px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--navy);
        font-weight: 700;
        margin-bottom: 16px;
      }
      .actions {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }
      .danger-btn {
        background: #fff;
        border: 2px solid rgba(217, 93, 93, 0.2);
        color: #b64a4a;
        border-radius: 14px;
        padding: 12px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="class-shell">
      <div class="class-card">
        <div class="class-head">
          <div class="menu-icon"><span></span></div>
          <h1 id="classTitle">授業登録</h1>
        </div>

        <div class="class-body">
          <div class="detail-line"><strong>教室</strong><span id="roomValue">未設定</span></div>
          <div class="detail-line"><strong>階数</strong><span id="floorValue">-</span></div>

          <form id="classForm" class="form-block">
            <div class="field">
              <label for="daySelect">曜日</label>
              <select id="daySelect" name="daySelect" required>
                <option value="月">月</option>
                <option value="火">火</option>
                <option value="水">水</option>
                <option value="木">木</option>
                <option value="金">金</option>
              </select>
            </div>

            <div class="field">
              <label for="periodSelect">時限</label>
              <select id="periodSelect" name="periodSelect" required>
                <option value="1">1限</option>
                <option value="2">2限</option>
                <option value="3">3限</option>
                <option value="4">4限</option>
                <option value="5">5限</option>
                <option value="6">6限</option>
                <option value="7">7限</option>
                <option value="8">8限</option>
                <option value="9">9限</option>
                <option value="10">10限</option>
                <option value="11">11限</option>
                <option value="12">12限</option>
              </select>
            </div>

            <div class="field">
              <label for="subjectSelect">授業を選ぶ</label>
              <select id="subjectSelect" name="subjectSelect" required>
                <option value="">授業を選択してください</option>
                <option value="国語">国語</option>
                <option value="数学">数学</option>
                <option value="英語">英語</option>
                <option value="理科">理科</option>
                <option value="社会">社会</option>
                <option value="情報">情報</option>
                <option value="保健体育">保健体育</option>
                <option value="美術">美術</option>
              </select>
            </div>

            <div class="field">
              <label for="teacher">担当者</label>
              <input id="teacher" name="teacher" type="text" placeholder="例: 山田先生" readonly />
            </div>

            <div class="field">
              <label for="room">教室</label>
              <input id="room" name="room" type="text" placeholder="例: 物理室" readonly />
            </div>

            <div class="field">
              <label for="floor">階数</label>
              <input id="floor" name="floor" type="number" min="1" max="20" placeholder="5" readonly />
            </div>

            <div class="actions">
              <button type="submit" class="primary-btn">保存</button>
              <button id="backBtn" type="button" class="secondary-btn">時間割に戻る</button>
              <button id="deleteBtn" type="button" class="danger-btn" hidden>削除</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="./firebase.js?v=20260921"></script>
    <script type="module" src="./auth.js?v=20260921"></script>
    <script type="module" src="./js/auth/auth-guard.js?v=20260921"></script>
    <script type="module" src="./js/class.js?v=20260921"></script>
  </body>
</html>
