<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub - 本人確認</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <style>
      body { background: #f3f5f7; }
      .verification-shell { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
      .verification-card { background: #fff; border: 2px solid rgba(22, 59, 99, 0.8); border-radius: 20px; padding: 20px; }
      .verification-form { display: grid; gap: 14px; margin-top: 20px; }
      .verification-form label { display: grid; gap: 6px; color: var(--navy); font-weight: 700; }
      .verification-form input { min-height: 44px; border: 1px solid rgba(22, 59, 99, 0.2); border-radius: 10px; padding: 8px 10px; }
      .verification-note { color: var(--muted); font-size: 0.9rem; }
      .verification-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <main class="verification-shell">
      <section class="verification-card">
        <h1>本人確認</h1>
        <p class="verification-note">学校メールアドレス、氏名、学籍番号を登録します。確認前でも基本機能は利用できます。</p>
        <p id="storageLimitText" class="verification-note">現在の資料保存上限を読み込んでいます。</p>
        <form id="verificationForm" class="verification-form">
          <label for="schoolEmail">学校メールアドレス<input id="schoolEmail" type="email" autocomplete="email" required /></label>
          <label for="fullName">氏名<input id="fullName" type="text" autocomplete="name" required maxlength="80" /></label>
          <label for="studentNumber">学籍番号<input id="studentNumber" type="text" required maxlength="40" /></label>
          <div class="verification-actions">
            <button class="primary-btn" type="submit">保存する</button>
            <a class="secondary-btn" href="./home.html">ホームへ戻る</a>
          </div>
        </form>
        <p id="verificationStatus" class="verification-note" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="./firebase.js?v=20260921-capacity1"></script>
    <script type="module" src="./auth.js?v=20260921-capacity1"></script>
    <script type="module" src="./js/auth/auth-guard.js?v=20260921-capacity1"></script>
    <script type="module" src="./js/verification.js?v=20260921-capacity1"></script>
  </body>
</html>
