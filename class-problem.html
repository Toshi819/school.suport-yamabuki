<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StudyHub - 授業の問題</title><link rel="stylesheet" href="./css/style.css"><style>body{background:#f3f5f7}.problem-shell{max-width:680px;margin:auto;padding:16px 10px 40px}.problem-panel{background:#fff;border:2px solid rgba(22,59,99,.8);border-radius:18px;padding:20px}.problem-panel h1{color:var(--navy);margin:0 0 6px}.problem-note,.progress{color:var(--muted);line-height:1.6}.question-panel{display:grid;gap:16px}.question-panel[hidden],.result-panel[hidden]{display:none}.choice-list{display:grid;gap:10px}.choice{min-height:54px;border:1px solid rgba(22,59,99,.2);border-radius:10px;background:#fff;text-align:left;padding:12px;font:inherit;cursor:pointer}.choice.correct{background:#c9ebc9}.choice.wrong{background:#f6c4c4}.choice:disabled{cursor:default}.problem-button{width:100%;min-height:50px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer}.result-pass{color:#197a35}.result-fail{color:#b64a4a}.back-link{display:block;margin-top:18px;color:var(--navy);text-align:center}</style></head>
<body><main class="problem-shell"><section class="problem-panel"><section id="questionPanel" class="question-panel"><h1>授業の問題</h1><p id="problemSubject" class="problem-note">読み込み中...</p><p id="questionProgress" class="progress"></p><h2 id="questionText"></h2><div id="choices" class="choice-list"></div><button id="nextButton" class="problem-button" type="button" hidden>次の問題</button><a id="backDuringQuiz" class="back-link" href="./home.html">授業メニューへ戻る</a></section><section id="resultPanel" class="result-panel" hidden><h1 id="resultTitle"></h1><p id="resultScore"></p><a id="backToClass" class="back-link" href="./home.html">授業メニューへ戻る</a></section></section></main><script type="module" src="./firebase.js?v=20260922-class-problem2"></script><script type="module" src="./auth.js?v=20260922-class-problem2"></script><script type="module" src="./js/auth/auth-guard.js?v=20260922-class-problem2"></script><script type="module" src="./js/class-problem.js?v=20260922-class-problem2"></script></body></html>
